services:
  - type: web
    name: huflit-ielts-reading
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_PATH
        value: /tmp/ielts.sqlite
      - key: ADMIN_EMAIL
        value: admin@huflit.edu.vn
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_DAYS
        value: 14
